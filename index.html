<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ziir</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ziir" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #F3F2EE;
    color: #22221F;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: #E7E5DD;
    border-radius: 8px;
    padding: 2px;
  }
  .tabs button {
    font-size: 12px;
    padding: 6px 12px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: #22221F;
  }
  .tabs button.active {
    background: #D8663F;
    color: white;
  }
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding-bottom: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.ziir {
    align-self: flex-start;
    background: white;
    border: 1px solid #E2E0D8;
    border-bottom-left-radius: 4px;
  }
  .msg.yo {
    align-self: flex-end;
    background: #D8663F;
    color: white;
    border-bottom-right-radius: 4px;
  }
  #calendario {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 12px;
  }
  .evento {
    display: flex;
    gap: 10px;
    background: white;
    border: 1px solid #E2E0D8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .evento .hora {
    color: #8A887E;
    width: 52px;
    flex-shrink: 0;
  }
  form {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  input[type="text"] {
    flex: 1;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #D9D7CE;
    padding: 0 12px;
    font-size: 14px;
    background: white;
  }
  input[type="text"]:focus {
    outline: 2px solid #D8663F;
  }
  button.enviar {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: none;
    background: #D8663F;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button.enviar:disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Ziir</h1>
    <div class="tabs">
      <button id="tab-chat" class="active">Chat</button>
      <button id="tab-cal">Calendario</button>
    </div>
  </header>

  <div id="chat"></div>

  <div id="calendario">
    <p style="font-size:13px; color:#8A887E; margin:0;">Los eventos aparecerán aquí cuando conectemos tu calendario real.</p>
  </div>

  <form id="form-chat">
    <input type="text" id="input-mensaje" placeholder="Escríbele a Ziir" autocomplete="off" />
    <button type="submit" class="enviar">&#8593;</button>
  </form>
</div>

<script>
  // Backend desplegado en Render.
  const BACKEND_URL = "https://asistente-7tva.onrender.com";

  const chatEl = document.getElementById("chat");
  const calEl = document.getElementById("calendario");
  const tabChat = document.getElementById("tab-chat");
  const tabCal = document.getElementById("tab-cal");
  const form = document.getElementById("form-chat");
  const input = document.getElementById("input-mensaje");
  const boton = form.querySelector("button");

  tabChat.addEventListener("click", () => {
    chatEl.style.display = "flex";
    calEl.style.display = "none";
    tabChat.classList.add("active");
    tabCal.classList.remove("active");
  });

  tabCal.addEventListener("click", () => {
    chatEl.style.display = "none";
    calEl.style.display = "flex";
    tabCal.classList.add("active");
    tabChat.classList.remove("active");
  });

  function agregarMensaje(texto, quien) {
    const div = document.createElement("div");
    div.className = "msg " + quien;
    div.textContent = texto;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;

    agregarMensaje(mensaje, "yo");
    input.value = "";
    boton.disabled = true;

    try {
      const resp = await fetch(BACKEND_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensaje }),
      });
      if (!resp.ok) throw new Error("Error del servidor");
      const data = await resp.json();
      agregarMensaje(data.respuesta, "ziir");
    } catch (err) {
      agregarMensaje("No pude conectarme con el backend. Revisa que esté corriendo.", "ziir");
    } finally {
      boton.disabled = false;
      input.focus();
    }
  });

  agregarMensaje("Hola, soy Ziir. ¿En qué te ayudo?", "ziir");
</script>
</body>
</html>
